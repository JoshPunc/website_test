<!DOCTYPE html>
<html lang="Deutsch">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css">
  <title>NoteVault</title>
</head>

<body>
<header>
  <h1><a href="index.html">NoteVault</a></h1>
</header>

<main>
  <!--Nav Bar-->
  <span class="nav">
                    <button class="dropdown-btn"><img class="burger" src="Pictures/burger.png" alt="Burger Menu"></button>
                    <div class="dropdown-container">
                        <a href="index.html">Startpage</a>
                        <a href="it-fundementals.html">IT-Fundementals</a>
                        <a href="algorithmen.html">Algorithmen</a>
                        <a href="betriebssystem-windows.html">Betriebssystem Windows</a>
                        <a href="submit.html">Notizen einsenden</a>
                    </div>
                </span>

  <!--Banner-->
  <img src="Pictures/banner.png" alt="Website Banner" class="banner">

  <!--Main content-->
  <div class="layout">
    <aside>

      <h2>Planen</h2>

      <button type="button">Neuer ToDo</button>
      <button type="button">ToDo löschen</button>

    </aside>

    <section class="content">
      <h2>Beitrag einsenden</h2>

      <p>Möchtest du deine Notizen mit der Welt teilen?</p>

      <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Name" required>

        <label for="modul">Modul:</label>
        <select id="modul" name="modul" required>
          <option value="">--</option>
          <option value="it-fundementals">IT-Fundementals</option>
          <option value="algorithmen">Algorithmen</option>
          <option value="betriebssystem_windows">Betriebssystem Windows</option>
          <option value="linux-camp">Linux-Camp</option>
          <option value="telematik">Telematik</option>
          <option value="datenbank">Datenbank</option>
          <option value="webtraining">Web Training</option>
          <option value="ioe">IoE</option>
          <option value="applikationsentwicklung">applikationsentwicklung</option>
        </select>

        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="email" placeholder="E-Mail-Adresse" required>

        <label for="notes">Notizen</label>
        <textarea id="notes" placeholder="Notizen" rows="6" required></textarea>

        <span>
        <button type="submit">einschicken</button>
        <button type="reset">rücksetzen</button>
        </span>

      </form>

    </section>

  </div>



</main>

<footer>
  <p>🄯 2025 NoteVault</p>
</footer>

</body>

</html>
